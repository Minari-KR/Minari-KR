<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 335" width="1200" height="335" role="img" aria-label="Minari · Game Designer. 아이디어를 프로토타입으로 만들고, 플레이하며 재미를 검증합니다. 우주선이 아이디어, 프로토타입, 플레이, 재미! 적을 차례로 맞히는 애니메이션.">
  <style>
    .bg { fill: #100e1e; }
    .name { fill: #fff4e4; font: 800 37px 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; letter-spacing: -0.5px; }
    .title { fill: #ff9b6e; font: 700 18px 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
    .tag { fill: #c9bfd8; font: 600 15px 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
    .hud { font: 700 11px monospace; letter-spacing: 1px; }
    .hud-l { fill: #ff9b6e; } .hud-v { fill: #fff4e4; }
    .space { fill: #100e1e; } .star1 { fill: #c9bfd8; } .star2 { fill: #7F77DD; }
    .ant { fill: #c9bfd8; } .wing { fill: #AFA9EC; } .ebody { fill: #f4845f; } .eye { fill: #FFF4E4; }
    .hull { fill: #fff4e4; } .trim { fill: #f29e4c; } .cock { fill: #7F77DD; } .fire { fill: #ff9b6e; }
    .spark1 { fill: #ffd27a; } .spark2 { fill: #ff9b6e; } .core { fill: #FFF4E4; }
    .shot { fill: #ffd27a; opacity: 0; animation: shot 10s linear infinite; }
    .dim { transform-box: fill-box; }
    .dim { fill: #4A4566; font: 700 11px 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; text-anchor: middle; animation: dimfade 10s infinite; }
    .lit { fill: #ffd27a; font: 700 11px 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; text-anchor: middle; opacity: 0; }
    .clear-a { fill: #ff9b6e; font: 700 11px monospace; letter-spacing: 2px; text-anchor: middle; }
    .clear-b { fill: #ffd27a; font: 800 16px 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; text-anchor: middle; }

    .fb { transform-box: fill-box; transform-origin: center; }
    .stars1 { animation: fall 6s linear infinite; } .stars2 { animation: fall 12s linear infinite; }
    .tw { animation: tw 1.6s ease-in-out infinite; }
    .flapA { animation: fa .4s steps(1) infinite; } .flapB { animation: fbx .4s steps(1) infinite; }
    .bob { animation: bob 1.6s ease-in-out infinite; }
    .flame { animation: fl .12s steps(1) infinite; }
    .ship { animation: ship 10s infinite; }
    .s1 { animation-delay: 0.6s; } .s2 { animation-delay: 2s; } .s3 { animation-delay: 3.4s; } .s4 { animation-delay: 4.8s; }
    .e1 { animation: d1 10s infinite; } .e2 { animation: d2 10s infinite; } .e3 { animation: d3 10s infinite; } .e4 { animation: d4 10s infinite; }
    .x1, .x2, .x3, .x4 { opacity: 0; }
    .x1 { animation: b1 10s ease-out infinite; } .x2 { animation: b2 10s ease-out infinite; } .x3 { animation: b3 10s ease-out infinite; } .x4 { animation: b4 10s ease-out infinite; }
    .k4 { fill: #ff9b6e; }
    .k1 { animation: l1 10s infinite; } .k2 { animation: l2 10s infinite; } .k3 { animation: l3 10s infinite; } .k4 { animation: l4 10s infinite; }
    .clear { opacity: 0; animation: clr 10s infinite; }
    .c1, .c2, .c3, .c4 { opacity: 0; }
    .c0 { animation: c0 10s steps(1) infinite; } .c1 { animation: c1 10s steps(1) infinite; } .c2 { animation: c2 10s steps(1) infinite; } .c3 { animation: c3 10s steps(1) infinite; } .c4 { animation: c4 10s steps(1) infinite; }
    @keyframes fall { to { transform: translateY(190px); } }
    @keyframes tw { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
    @keyframes fa { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes fbx { 0% { opacity: 0; } 50% { opacity: 1; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes fl { 0% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes ship {
      0%,14% { transform: translateX(0); animation-timing-function: cubic-bezier(.5,0,.3,1); }
      19%,28% { transform: translateX(90px); animation-timing-function: cubic-bezier(.5,0,.3,1); }
      33%,42% { transform: translateX(180px); animation-timing-function: cubic-bezier(.5,0,.3,1); }
      47%,56% { transform: translateX(270px); animation-timing-function: cubic-bezier(.5,0,.3,1); }
      62% { transform: translateX(135px) translateY(-8px); } 66% { transform: translateX(135px) translateY(0); } 70% { transform: translateX(135px) translateY(-6px); }
      74%,86% { transform: translateX(135px) translateY(0); animation-timing-function: cubic-bezier(.5,0,.3,1); }
      96%,100% { transform: translateX(0); } }
    @keyframes shot { 0% { opacity: 1; transform: translateY(0); } 4% { opacity: 1; transform: translateY(-53.8px); } 4.1%,100% { opacity: 0; transform: translateY(-53.8px); } }
    @keyframes dimfade { 0%,56% { opacity: 1; transform: none; } 60%,90% { opacity: 0; transform: translateY(-8px); } 96%,100% { opacity: 1; transform: none; } }
    @keyframes clr { 0%,57% { opacity: 0; transform: scale(.4); } 61% { opacity: 1; transform: scale(1.15); } 64% { transform: scale(1); } 84% { opacity: 1; transform: scale(1); } 88%,100% { opacity: 0; transform: scale(1); } }
    @keyframes d1 { 0%,10% { opacity:1; transform:none; } 11.5% { opacity:1; transform:scale(1.5); } 12.5% { opacity:0; transform:scale(.2); } 86% { opacity:0; transform:translateY(-40px); } 95%,100% { opacity:1; transform:none; } }
    @keyframes b1 { 0%,10% { opacity:0; transform:scale(.2); } 11% { opacity:1; transform:scale(1); } 16%,100% { opacity:0; transform:scale(1.9); } }
    @keyframes l1 { 0%,10.5% { opacity:0; transform:scale(.6); } 12.5% { opacity:1; transform:scale(1.3); } 14.5% { transform:scale(1); } 56% { opacity:1; transform:none; } 60%,100% { opacity:0; transform:translateY(-8px) scale(.8); } }
    @keyframes d2 { 0%,24% { opacity:1; transform:none; } 25.5% { opacity:1; transform:scale(1.5); } 26.5% { opacity:0; transform:scale(.2); } 87% { opacity:0; transform:translateY(-40px); } 96%,100% { opacity:1; transform:none; } }
    @keyframes b2 { 0%,24% { opacity:0; transform:scale(.2); } 25% { opacity:1; transform:scale(1); } 30%,100% { opacity:0; transform:scale(1.9); } }
    @keyframes l2 { 0%,24.5% { opacity:0; transform:scale(.6); } 26.5% { opacity:1; transform:scale(1.3); } 28.5% { transform:scale(1); } 56% { opacity:1; transform:none; } 60%,100% { opacity:0; transform:translateY(-8px) scale(.8); } }
    @keyframes d3 { 0%,38% { opacity:1; transform:none; } 39.5% { opacity:1; transform:scale(1.5); } 40.5% { opacity:0; transform:scale(.2); } 88% { opacity:0; transform:translateY(-40px); } 97%,100% { opacity:1; transform:none; } }
    @keyframes b3 { 0%,38% { opacity:0; transform:scale(.2); } 39% { opacity:1; transform:scale(1); } 44%,100% { opacity:0; transform:scale(1.9); } }
    @keyframes l3 { 0%,38.5% { opacity:0; transform:scale(.6); } 40.5% { opacity:1; transform:scale(1.3); } 42.5% { transform:scale(1); } 56% { opacity:1; transform:none; } 60%,100% { opacity:0; transform:translateY(-8px) scale(.8); } }
    @keyframes d4 { 0%,52% { opacity:1; transform:none; } 53.5% { opacity:1; transform:scale(1.5); } 54.5% { opacity:0; transform:scale(.2); } 89% { opacity:0; transform:translateY(-40px); } 98%,100% { opacity:1; transform:none; } }
    @keyframes b4 { 0%,52% { opacity:0; transform:scale(.2); } 53% { opacity:1; transform:scale(1); } 58%,100% { opacity:0; transform:scale(1.9); } }
    @keyframes l4 { 0%,52.5% { opacity:0; transform:scale(.6); } 54.5% { opacity:1; transform:scale(1.3); } 56.5% { transform:scale(1); } 56% { opacity:1; transform:none; } 60%,100% { opacity:0; transform:translateY(-8px) scale(.8); } }
    @keyframes c0 { 0% { opacity:1; } 11% { opacity:0; } }
    @keyframes c1 { 0% { opacity:0; } 11% { opacity:1; } 25% { opacity:0; } }
    @keyframes c2 { 0% { opacity:0; } 25% { opacity:1; } 39% { opacity:0; } }
    @keyframes c3 { 0% { opacity:0; } 39% { opacity:1; } 53% { opacity:0; } }
    @keyframes c4 { 0% { opacity:0; } 53% { opacity:1; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .lit { opacity: 1; }
    }
  </style>
